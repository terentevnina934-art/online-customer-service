<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>専属カスタマーサポート</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  background:#071827;color:#fff
}
.app{height:100%;display:flex;flex-direction:column}
.top{
  height:48px;background:#14263d;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;position:relative
}
.messages{
  flex:1;overflow:auto;
  padding:22px 14px 90px;
  display:flex;flex-direction:column;gap:12px
}
.welcome,.agent{
  align-self:flex-start;
  max-width:82%;
  background:#172c42;
  border-radius:16px 16px 16px 4px;
  padding:11px 14px;
  line-height:1.45
}
.customer{
  align-self:flex-end;
  max-width:82%;
  background:#2a9df4;
  border-radius:16px 16px 4px 16px;
  padding:11px 14px;
  line-height:1.45
}
.meta{font-size:11px;color:#9bb0c6;margin-top:5px}
.online{font-size:12px;color:#9bb0c6;margin-bottom:4px}
.dot{
  display:inline-block;width:8px;height:8px;
  background:#31d07f;border-radius:50%;margin-right:6px
}
.inputbar{
  position:fixed;left:0;right:0;bottom:0;
  background:#14263d;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:9px
}
.inputbar input{
  flex:1;border:1px solid #2a4562;
  background:#0b1d2f;color:#fff;
  border-radius:24px;padding:11px 14px;outline:none
}
.inputbar button{
  border:0;border-radius:24px;
  background:#2a9df4;color:#fff;
  padding:0 18px;font-weight:700
}
.status{
  position:absolute;right:10px;
  font-size:11px;color:#90a3b8
}
</style>
</head>

<body>
<div class="app">

<div class="top">
専属カスタマーサポート
<span id="status" class="status">接続中</span>
</div>

<div id="messages" class="messages">

<div class="welcome">
<div class="online">
<span class="dot"></span>カスタマーサポート対応中
</div>

こんにちは。専属カスタマーサポートです。ご相談内容を入力してください。
</div>

</div>

<form id="form" class="inputbar">
<input id="input" placeholder="メッセージを入力してください…" autocomplete="off">
<button type="submit">送信</button>
</form>

</div>

<script>
const API='https://wmqasobxlulvmhifjfyp.supabase.co/functions/v1/smart-task';

const box=document.getElementById('messages');
const form=document.getElementById('form');
const input=document.getElementById('input');
const statusEl=document.getElementById('status');

const seen=new Set();
let lastId=0;

function token(){
  let t=localStorage.getItem('cs_customer_token');

  if(!t){
    const a=new Uint8Array(24);
    crypto.getRandomValues(a);

    t=btoa(String.fromCharCode(...a))
      .replaceAll('+','-')
      .replaceAll('/','_')
      .replaceAll('=','');

    localStorage.setItem('cs_customer_token',t);
  }

  return t;
}

const TOKEN=token();

async function call(body){
  const r=await fetch(API,{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify(body)
  });

  if(!r.ok) throw new Error(await r.text());

  return r.json();
}

function tm(s){
  try{
    return new Date(s).toLocaleTimeString('ja-JP',{
      hour:'2-digit',
      minute:'2-digit'
    });
  }catch{
    return '';
  }
}

function render(m){
  if(!m || seen.has(m.id)) return;

  seen.add(m.id);
  lastId=Math.max(lastId,Number(m.id)||0);

  const d=document.createElement('div');

  d.className=m.sender==='agent'?'agent':'customer';

  const t=document.createElement('div');
  t.textContent=m.body;

  const meta=document.createElement('div');
  meta.className='meta';
  meta.textContent=tm(m.created_at);

  d.append(t,meta);

  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

async function sync(){
  try{
    await call({
      action:'customer_sync',
      token:TOKEN
    });

    const d=await call({
      action:'customer_messages',
      token:TOKEN,
      after:lastId
    });

    (d.messages||[]).forEach(render);

    statusEl.textContent='オンライン';

  }catch(e){
    statusEl.textContent='再接続中';
  }
}

form.addEventListener('submit',async e=>{
  e.preventDefault();

  const text=input.value.trim();

  if(!text) return;

  input.value='';

  try{
    const d=await call({
      action:'customer_send',
      token:TOKEN,
      text
    });

    render(d.message);

  }catch(e){
    input.value=text;
    alert('送信に失敗しました。しばらくしてからもう一度お試しください。');
  }
});

sync();
setInterval(sync,1200);
</script>

</body>
</html>
